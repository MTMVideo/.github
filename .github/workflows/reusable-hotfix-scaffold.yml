name: Reusable — Hotfix scaffold

on:
  workflow_call:
    inputs:
      ticket_id:
        description: 'Ticket ID, e.g. MTM-1234'
        required: true
        type: string
      summary:
        description: 'One-line incident summary'
        required: true
        type: string

jobs:
  scaffold:
    name: Create hotfix branch + draft PR
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create + push branch
      pull-requests: write  # open draft PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need all tags + history
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base tag and build branch name
        id: resolve
        run: |
          set -euo pipefail

          ticket="${{ inputs.ticket_id }}"
          summary="${{ inputs.summary }}"

          # Latest v*.*.* tag = current prod. If none exists yet, fall back
          # to main with a loud warning so the scaffold still works on
          # repos that haven't completed Phase 4 yet.
          prod_tag=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1 || true)
          if [ -z "$prod_tag" ]; then
            base_ref="main"
            base_label="main (no v*.*.* tag found — repo hasn't completed Phase 4)"
          else
            base_ref="$prod_tag"
            base_label="$prod_tag"
          fi

          # Slugify summary: lowercase, ASCII only, hyphenated, ≤40 chars.
          slug=$(printf '%s' "$summary" \
            | tr 'A-Z' 'a-z' \
            | tr -c 'a-z0-9' '-' \
            | sed -E 's/-+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-40 \
            | sed -E 's/-+$//')

          branch="hotfix/${ticket}-${slug}"
          echo "base_ref=$base_ref"     >> "$GITHUB_OUTPUT"
          echo "base_label=$base_label" >> "$GITHUB_OUTPUT"
          echo "branch=$branch"         >> "$GITHUB_OUTPUT"

          echo "Will branch '$branch' from '$base_label'"

      - name: Create and push branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_ref="${{ steps.resolve.outputs.base_ref }}"
          branch="${{ steps.resolve.outputs.branch }}"

          # Refuse if branch already exists — avoids clobbering an
          # in-progress hotfix branch.
          if git ls-remote --heads origin "$branch" | grep -q .; then
            echo "::error::Branch $branch already exists. Re-run with a different ticket/summary, or delete the old branch first."
            exit 1
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b "$branch" "$base_ref"

          # Placeholder empty commit so a PR can be opened immediately
          # even when main and the prod tag point at the same SHA. The
          # squash-merge at the end of the hotfix workflow erases it.
          git commit --allow-empty -m "chore: scaffold hotfix branch for ${{ inputs.ticket_id }}

This placeholder commit lets the draft PR open. It will disappear when
the hotfix is squash-merged."

          git push -u origin "$branch"

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ticket="${{ inputs.ticket_id }}"
          summary="${{ inputs.summary }}"
          branch="${{ steps.resolve.outputs.branch }}"
          base_label="${{ steps.resolve.outputs.base_label }}"

          body=$(mktemp)
          {
            printf '## Incident\n\n'
            printf '**Ticket:** %s\n' "$ticket"
            printf '**Branched from:** `%s`\n' "$base_label"
            printf '**Summary:** %s\n\n' "$summary"

            printf '## Fix\n\n'
            printf '<!-- Describe what you changed and why -->\n\n'

            printf '## Validation\n\n'
            printf -- '- [ ] Reproduced the issue locally\n'
            printf -- '- [ ] Wrote a regression test\n'
            printf -- '- [ ] Verified fix on dev\n'
            printf -- '- [ ] Verified fix on stg with same artifact\n\n'

            printf '## Rollout\n\n'
            printf -- '- [ ] Hotfix tag created (`vX.Y.Z+1`)\n'
            printf -- '- [ ] Promoted to UAT\n'
            printf -- '- [ ] Promoted to Production\n'
            printf -- '- [ ] Cherry-picked / merged back to main\n'
            printf -- '- [ ] Post-mortem issue assigned and scheduled\n\n'

            printf '_Scaffold generated by `hotfix-scaffold` workflow. Once you push commits to `%s`, this PR will populate with the diff._\n' "$branch"
          } > "$body"

          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "hotfix: ${summary} (${ticket})" \
            --body-file "$body"

      - name: Write step summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${{ steps.resolve.outputs.branch }}"
          base_label="${{ steps.resolve.outputs.base_label }}"

          # Look up the PR we just opened.
          pr_url=$(gh pr list --head "$branch" --json url --jq '.[0].url' || echo "(not found)")

          {
            echo "## 🚑 Hotfix scaffold complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ticket | \`${{ inputs.ticket_id }}\` |"
            echo "| Branched from | \`$base_label\` |"
            echo "| Branch | \`$branch\` |"
            echo "| Draft PR | $pr_url |"
            echo ""
            echo "### Next steps"
            echo ""
            echo '```bash'
            echo "git fetch origin"
            echo "git checkout $branch"
            echo "# ...make your fix, commit, push..."
            echo '```'
            echo ""
            echo "When the fix lands on the branch, push a hotfix tag to trigger the release pipeline. Example for current prod \`$base_label\`:"
            echo ""
            echo '```bash'
            echo "git tag v<next-patch>"
            echo "git push origin v<next-patch>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
