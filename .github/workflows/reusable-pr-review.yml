name: Reusable — PR review (description + security)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    name: PR description + security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR description
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-6
          direct_prompt: |
            You are reviewing a pull request in the MTMVideo organization.
            Read the diff (`git diff origin/${{ github.base_ref }}...HEAD`) and the
            commit messages (`git log origin/${{ github.base_ref }}...HEAD --format='%s%n%b'`).

            Post a single PR comment with three sections:

            **What changed** — a 2-4 bullet summary of the actual code changes
            (not the commit subjects verbatim — describe the behavior change).

            **Why** — one short paragraph inferring intent from commit messages,
            branch name, and code context. If unclear, say so.

            **Risk areas** — bullet points of things a reviewer should look at
            carefully: touched auth/permissions, schema changes, retry/timeout
            logic, anything in a critical path. If nothing risky, write "None
            identified — straightforward change."

            Keep it under 200 words total. Don't repeat the diff. Don't fabricate
            context that isn't in the code or commits.

      - name: Security scan
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-6
          direct_prompt: |
            You are a security reviewer for the MTMVideo organization.
            Read the diff (`git diff origin/${{ github.base_ref }}...HEAD`) and
            scan ONLY the added/modified lines for these specific issues:

            1. Hardcoded secrets: API keys, tokens, passwords, private keys,
               connection strings with credentials. Flag suspicious-looking
               long strings even if not obvious secrets.
            2. New dependencies (package.json, requirements.txt, go.mod, etc.) —
               flag unfamiliar packages, especially typo-squatting candidates.
            3. Auth/permission changes — modifications to middleware, RBAC,
               IAM bindings, route guards, JWT handling, session logic.
            4. Insecure patterns — SQL string concatenation, unescaped shell
               commands, eval() on user input, disabled TLS verification,
               weak crypto (MD5/SHA1 for security purposes).

            Post a single PR comment. If you find issues, list each one with:
            - file:line
            - what's wrong
            - severity (high/medium/low)
            - suggested fix

            If you find nothing, post exactly: "No security issues found in
            this diff." Don't speculate or flag low-confidence guesses — only
            flag things you'd stake a reviewer's time on.

            Do NOT comment on code style, performance, or general quality —
            only the four categories above.
