name: Weekly stale branch report

on:
  schedule:
    - cron: '0 9 * * MON'   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      delete_stale_branches:
        description: 'Delete the stale branches after reporting? Default is no (report only).'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'
      confirm_text:
        description: 'Required when deleting: type YES-DELETE exactly to confirm. Leave blank for report-only runs.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect stale branches across org
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          THRESHOLD_DAYS=30
          THRESHOLD=$(date -u -d "${THRESHOLD_DAYS} days ago" +%s)
          NOW=$(date -u +%s)
          : > stale.txt

          # List repos. Drop --source if you also want forks scanned. Keep
          # --no-archived to skip dormant repos.
          mapfile -t REPOS < <(gh repo list MTMVideo --limit 200 --source --no-archived --json name --jq '.[].name')
          echo "::group::Repos visible to PAT (${#REPOS[@]} total)"
          printf '  %s\n' "${REPOS[@]}"
          echo "::endgroup::"

          if [ "${#REPOS[@]}" -eq 0 ]; then
            echo "::error::PAT returned 0 repos. Check fine-grained PAT permissions:"
            echo "  Repository access: All repositories (under MTMVideo)"
            echo "  Permissions → Repository: Metadata (Read), Contents (Read)"
            exit 1
          fi

          # GraphQL: fetch 100 branches + commit dates per request, paginated.
          # ~100x faster than the previous per-branch REST loop.
          read -r -d '' QUERY <<'EOF' || true
          query($owner: String!, $name: String!, $endCursor: String) {
            repository(owner: $owner, name: $name) {
              refs(refPrefix: "refs/heads/", first: 100, after: $endCursor) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  name
                  target {
                    ... on Commit { committedDate }
                  }
                }
              }
            }
          }
          EOF

          for repo in "${REPOS[@]}"; do
            # Pull all branches + commit dates in one paginated GraphQL call.
            # Output is one TSV line per branch: <name>\t<committedDate>.
            BRANCH_DATA=$(gh api graphql --paginate \
              -F owner=MTMVideo -F name="$repo" \
              -f query="$QUERY" \
              --jq '.data.repository.refs.nodes[] | [.name, .target.committedDate] | @tsv' 2>/dev/null || true)

            total=$(printf '%s\n' "$BRANCH_DATA" | grep -c . || true)
            # Exclude long-lived branches.
            FILTERED=$(printf '%s\n' "$BRANCH_DATA" | grep -Ev $'^(main|master|studio-dev|studio-stg|studio-uat|studio-prod)\t' || true)
            eligible=$(printf '%s\n' "$FILTERED" | grep -c . || true)

            echo "::group::$repo — $total total branches, $eligible eligible"

            stale_count=0
            while IFS=$'\t' read -r branch commit_iso; do
              [ -z "$branch" ] && continue
              [ -z "$commit_iso" ] && continue
              commit_ts=$(date -u -d "$commit_iso" +%s)
              age_days=$(( (NOW - commit_ts) / 86400 ))
              if [ "$commit_ts" -lt "$THRESHOLD" ]; then
                echo "  ✗  $branch — $age_days days (stale)"
                echo "$repo,$branch,$age_days" >> stale.txt
                stale_count=$((stale_count + 1))
              fi
            done <<< "$FILTERED"

            [ "$stale_count" -eq 0 ] && echo "  (no stale branches)"
            echo "::endgroup::"
          done

          echo ""
          echo "─── Summary ───"
          echo "Repos scanned: ${#REPOS[@]}"
          echo "Stale branches found: $(wc -l < stale.txt)"
          echo ""
          echo "─── stale.txt contents ───"
          cat stale.txt || echo "(empty)"

      - name: Format report
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ ! -s stale.txt ]; then
            printf '_Last updated: %s_\n\nAll branches are fresh — no action needed.\n' "$TS" > report.md
            exit 0
          fi

          # Sort by repo (col 1) then by age descending (col 3, numeric).
          # Then awk groups consecutive same-repo lines under a ## header.
          {
            printf '_Last updated: %s_\n\n' "$TS"
            sort -t, -k1,1 -k3,3nr stale.txt | awk -F, '
              $1 != prev_repo {
                if (prev_repo != "") print ""
                print "## " $1
                prev_repo = $1
              }
              { print "- `" $2 "` — " $3 " days old" }
            '
          } > report.md

      - name: Delete stale branches (gated)
        if: github.event_name == 'workflow_dispatch' && inputs.delete_stale_branches == 'yes'
        env:
          # Requires PAT with Contents: Write across all managed repos.
          # Without write permission this step 403s — that's intentional;
          # widening to write is an explicit decision.
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirm_text }}" != "YES-DELETE" ]; then
            echo "::error::delete_stale_branches=yes but confirm_text is not 'YES-DELETE'. Aborting."
            echo "Re-run the workflow with confirm_text set to YES-DELETE exactly."
            exit 1
          fi

          if [ ! -s stale.txt ]; then
            echo "stale.txt is empty — nothing to delete."
            exit 0
          fi

          echo "::warning::Deleting $(wc -l < stale.txt) branches across managed repos."
          deleted=0
          failed=0
          while IFS=, read -r repo branch age_days; do
            [ -z "$repo" ] && continue
            # URL-encode the branch name (handles slashes etc.)
            ref="refs/heads/$branch"
            if gh api -X DELETE "/repos/MTMVideo/$repo/git/$ref" 2>/dev/null; then
              echo "  ✓ deleted $repo / $branch ($age_days days)"
              deleted=$((deleted + 1))
            else
              echo "  ✗ failed   $repo / $branch ($age_days days)"
              failed=$((failed + 1))
            fi
          done < stale.txt

          echo ""
          echo "Deleted: $deleted"
          echo "Failed:  $failed"
          [ "$failed" -gt 0 ] && exit 1 || true

      - name: Post or update rolling issue
        env:
          # Use the workflow's built-in token, not ORG_READ_TOKEN. The PAT is
          # scoped read-only for cross-repo branch listing; GITHUB_TOKEN has
          # issues:write on the repo where this workflow runs (.github).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Stale branch tracker"
          REPO="MTMVideo/.github"

          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --repo "$REPO" --body-file report.md
          else
            echo "Creating new issue"
            gh issue create --repo "$REPO" --title "$TITLE" --body-file report.md
          fi
