name: Weekly stale branch report

on:
  schedule:
    - cron: '0 9 * * MON'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect stale branches across org
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          THRESHOLD=$(date -u -d '30 days ago' +%s)
          : > stale.txt

          # --source excludes forks; --no-archived excludes archived repos.
          # Without these, ancient OSS forks get flagged for stale `master`.
          for repo in $(gh repo list MTMVideo --limit 200 --source --no-archived --json name --jq '.[].name'); do
            gh api "/repos/MTMVideo/$repo/branches?per_page=100" --paginate \
              --jq '.[] | select(.name != "main" and (.name | startswith("studio-") | not)) | .name' \
            | while read -r branch; do
              commit_iso=$(gh api "/repos/MTMVideo/$repo/branches/$branch" --jq '.commit.commit.committer.date' 2>/dev/null || echo "")
              [ -z "$commit_iso" ] && continue
              commit_ts=$(date -u -d "$commit_iso" +%s)
              if [ "$commit_ts" -lt "$THRESHOLD" ]; then
                age_days=$(( ($(date -u +%s) - commit_ts) / 86400 ))
                echo "$repo,$branch,$age_days" >> stale.txt
              fi
            done
          done

          echo "Found $(wc -l < stale.txt) stale branches"

      - name: Format report with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          model: claude-haiku-4-5
          direct_prompt: |
            Read stale.txt. Each line is `repo,branch,age_days`. Group by repo
            (alphabetical), sort within each repo by age descending.

            Write the markdown to a file at ./report.md with this exact format:

              _Last updated: <ISO timestamp>_

              ## <repo>
              - `<branch>` — <age> days old

            Repeat the `## <repo>` block for each repo. If stale.txt is empty,
            write only:

              _Last updated: <ISO timestamp>_

              All branches are fresh — no action needed.

            Don't editorialise. Don't suggest deletions. Don't create or edit
            any GitHub issues — a later step handles posting.

      - name: Post or update rolling issue
        env:
          # Use the workflow's built-in token, not ORG_READ_TOKEN. The PAT is
          # scoped read-only for cross-repo branch listing; GITHUB_TOKEN has
          # issues:write on the repo where this workflow runs (.github).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Stale branch tracker"
          REPO="MTMVideo/.github"

          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --repo "$REPO" --body-file report.md
          else
            echo "Creating new issue"
            gh issue create --repo "$REPO" --title "$TITLE" --body-file report.md
          fi
