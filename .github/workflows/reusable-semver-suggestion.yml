name: Reusable — Semver suggestion

on:
  workflow_call:

jobs:
  suggest:
    name: Suggest next semver
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for tag + log

      - name: Compute next version
        run: |
          set -euo pipefail

          last_tag=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || echo "")

          if [ -z "$last_tag" ]; then
            range="HEAD"
            prev_display="(none — no v*.*.* tag found)"
            major=0
            minor=0
            patch=0
            first_release=1
          else
            range="$last_tag..HEAD"
            prev_display="$last_tag"
            # Strip the leading v and split into M.m.p
            IFS='.' read -r major minor patch <<< "${last_tag#v}"
            first_release=0
          fi

          # Pull commit subjects + bodies for analysis. Each commit is one
          # null-delimited block so multi-line bodies (BREAKING CHANGE
          # footers) stay attached to their subject.
          mapfile -d '' -t COMMITS < <(git log "$range" --format='%s%n%b%x00' 2>/dev/null || true)
          count=${#COMMITS[@]}

          # Classify each commit. Track the highest bump type seen.
          # 3 = major, 2 = minor, 1 = patch, 0 = none.
          highest=0
          breaking_shas=()
          feat_shas=()
          fix_shas=()
          chore_shas=()
          unknown_shas=()

          # Re-walk commits to also collect short SHAs alongside subjects.
          while IFS=$'\t' read -r sha subject body; do
            [ -z "$sha" ] && continue
            full="$subject"$'\n'"$body"

            # MAJOR: BREAKING CHANGE footer OR `!` after type (e.g. feat!:, fix!:)
            if printf '%s' "$full" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:' \
              || printf '%s' "$full" | grep -qiE 'BREAKING CHANGE:'; then
              highest=3
              breaking_shas+=("$sha $subject")
              continue
            fi

            # MINOR: feat: or feat(scope):
            if printf '%s' "$subject" | grep -qE '^feat(\([^)]+\))?:'; then
              [ "$highest" -lt 2 ] && highest=2
              feat_shas+=("$sha $subject")
              continue
            fi

            # PATCH: fix, chore, ci, docs, refactor, test, perf, style, build, revert
            if printf '%s' "$subject" | grep -qE '^(fix|chore|ci|docs|refactor|test|perf|style|build|revert)(\([^)]+\))?:'; then
              [ "$highest" -lt 1 ] && highest=1
              # Bucket fixes separately for clearer reporting.
              if printf '%s' "$subject" | grep -qE '^fix(\([^)]+\))?:'; then
                fix_shas+=("$sha $subject")
              else
                chore_shas+=("$sha $subject")
              fi
              continue
            fi

            # Anything else — non-Conventional Commits. Treat as patch but flag.
            [ "$highest" -lt 1 ] && highest=1
            unknown_shas+=("$sha $subject")
          done < <(git log "$range" --format='%h%x09%s%x09%b' 2>/dev/null || true)

          # Decide next version.
          if [ "$first_release" -eq 1 ]; then
            bump_label="FIRST RELEASE"
            next_version="v0.1.0"
            why="No previous tag found — suggesting v0.1.0 as the first release."
          elif [ "$count" -eq 0 ]; then
            bump_label="NO CHANGE"
            next_version="$last_tag"
            why="No commits since $last_tag — nothing to release."
          else
            case "$highest" in
              3)
                bump_label="MAJOR"
                next_version="v$((major + 1)).0.0"
                why="Breaking change detected in: ${breaking_shas[0]}"
                ;;
              2)
                bump_label="MINOR"
                next_version="v${major}.$((minor + 1)).0"
                why="New feature(s) detected, no breaking changes. First feat: ${feat_shas[0]}"
                ;;
              1)
                bump_label="PATCH"
                next_version="v${major}.${minor}.$((patch + 1))"
                if [ "${#unknown_shas[@]}" -gt 0 ] && [ "${#fix_shas[@]}" -eq 0 ] && [ "${#chore_shas[@]}" -eq 0 ]; then
                  why="Only non-Conventional-Commit subjects found — defaulting to PATCH. Consider rewriting commit messages to follow the standard."
                else
                  why="Only fixes / chores / docs / etc. — no new features or breaking changes."
                fi
                ;;
              *)
                bump_label="PATCH"
                next_version="v${major}.${minor}.$((patch + 1))"
                why="Could not classify commits; defaulting to PATCH."
                ;;
            esac
          fi

          # Write the step summary.
          {
            echo "## Suggested version: \`$next_version\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Previous tag | \`$prev_display\` |"
            echo "| Commits analysed | $count |"
            echo "| Bump type | **$bump_label** |"
            echo ""
            echo "**Why:** $why"
            echo ""
            echo "### To tag and release"
            echo ""
            echo '```bash'
            echo "git tag $next_version"
            echo "git push --tags"
            echo '```'
            echo ""

            if [ "${#breaking_shas[@]}" -gt 0 ]; then
              echo "### 💥 Breaking changes (${#breaking_shas[@]})"
              for entry in "${breaking_shas[@]}"; do echo "- $entry"; done
              echo ""
            fi
            if [ "${#feat_shas[@]}" -gt 0 ]; then
              echo "### ✨ Features (${#feat_shas[@]})"
              for entry in "${feat_shas[@]}"; do echo "- $entry"; done
              echo ""
            fi
            if [ "${#fix_shas[@]}" -gt 0 ]; then
              echo "### 🐛 Fixes (${#fix_shas[@]})"
              for entry in "${fix_shas[@]}"; do echo "- $entry"; done
              echo ""
            fi
            if [ "${#chore_shas[@]}" -gt 0 ]; then
              echo "<details><summary>🔧 Internal (${#chore_shas[@]})</summary>"
              echo ""
              for entry in "${chore_shas[@]}"; do echo "- $entry"; done
              echo ""
              echo "</details>"
              echo ""
            fi
            if [ "${#unknown_shas[@]}" -gt 0 ]; then
              echo "<details><summary>⚠️ Non-Conventional-Commit subjects (${#unknown_shas[@]})</summary>"
              echo ""
              for entry in "${unknown_shas[@]}"; do echo "- $entry"; done
              echo ""
              echo "</details>"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Also log to stdout for the run log.
          echo "Suggested: $next_version  (bump: $bump_label, $count commits since $prev_display)"
